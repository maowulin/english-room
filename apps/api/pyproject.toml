[project]
name = "english-room-api"
version = "0.1.0"
description = "FastAPI control plane for the English room demo"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "pydantic-settings>=2.10.0,<3.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "mypy>=1.17.0,<2.0",
    "pytest>=8.4.0,<9.0",
    "ruff>=0.12.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_room_api"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
